<style>

.pay-box{border:1px dashed var(--maroon);border-radius:10px;padding:14px;background:var(--maroon-soft)}
.pay-box .amount{font-size:1.3rem;font-weight:800;color:var(--maroon-dark)}
.money{font-weight:700;color:var(--maroon-dark);white-space:nowrap}

.krs-course input{width:auto;margin-top:4px;flex-shrink:0}
.krs-course .cinfo{flex:1;font-size:.88rem}
.krs-course .cinfo b{color:var(--maroon-dark)}
.sks-total{font-size:1.05rem;font-weight:800;color:var(--maroon-dark)}
.ann-item{border-left:4px solid var(--maroon);padding:10px 14px;background:var(--maroon-soft);border-radius:6px;margin-bottom:10px}

.ann-item.unread{border-left-color:var(--gold);background:var(--warn-bg)}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =========================================================
   SIAKAD STIKMI v2 (Supabase) — Single-file app, backend Supabase
   - Login: Supabase Auth (email + password)
   - Data: PostgreSQL via RPC SECURITY DEFINER (sync_all + mutasi)
   - Dokumen: Storage bucket "stikmi-docs"
   - Penyimpanan terpusat: admin & mahasiswa share data sama
   ========================================================= */

/* ---------- KONFIGURASI SUPABASE (isi sesuai PANDUAN_SETUP_SUPABASE.md) ---------- */
const SUPABASE_URL = 'https://kfkukrspvbaekfngkviq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_MmHhud34WX8hN9N_-vWMtw_iAWgNtkv';
let sb = null; // Supabase client
function initSupabase(){
  try{
    if(window.supabase && SUPABASE_URL && SUPABASE_KEY &&
       SUPABASE_URL!=='PASTE_URL_DISINI'){
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      // Tangkap event recovery dari klik tautan reset password di email.
      // Supabase sudah mem-parse token & membuat session recovery; kita arahkan
      // user ke form "Password Baru" supaya tidak terjebak di halaman login.
      sb.auth.onAuthStateChange((event/*, session*/) => {
        if(event === 'PASSWORD_RECOVERY' && location.hash !== '#/reset-password'){
          location.hash = '#/reset-password';
        }
      });
    }
  }catch(e){ console.error('Supabase init gagal:', e); }
}

const APP_VERSION = '2.0';

/* ---------- Katalog Mata Kuliah (per prodi, per semester) ---------- */
const KATALOG_MK = {
  'P01': [
    {kode:'MK-101',nama:'Ear Training I',sks:2,smt:1,wajib:true},
    {kode:'MK-102',nama:'Teori Musik Dasar',sks:2,smt:1,wajib:true},
    {kode:'MK-103',nama:'Instrumen Mayor I',sks:3,smt:1,wajib:true},
    {kode:'MK-104',nama:'Sejarah Musik Barat',sks:2,smt:1,wajib:true},
    {kode:'MK-105',nama:'Pendidikan Agama',sks:2,smt:1,wajib:true},
    {kode:'MK-106',nama:'Bahasa Indonesia',sks:2,smt:1,wajib:true},
    {kode:'MK-107',nama:'Choir / Ensemble I',sks:1,smt:1,wajib:true},
    {kode:'MK-201',nama:'Ear Training II',sks:2,smt:2,wajib:true},
    {kode:'MK-202',nama:'Harmoni I',sks:3,smt:2,wajib:true},
    {kode:'MK-203',nama:'Instrumen Mayor II',sks:3,smt:2,wajib:true},
    {kode:'MK-204',nama:'Analisis Bentuk',sks:2,smt:2,wajib:true},
    {kode:'MK-205',nama:'Musik Dunia',sks:2,smt:2,wajib:false},
    {kode:'MK-206',nama:'Pendidikan Pancasila',sks:2,smt:2,wajib:true},
    {kode:'MK-207',nama:'Piano Wajib I',sks:1,smt:2,wajib:false}
  ],
  'P03': [
    {kode:'MK-301',nama:'Dasar-Dasar Pendidikan Musik',sks:3,smt:1,wajib:true},
    {kode:'MK-302',nama:'Teori Musik Dasar',sks:2,smt:1,wajib:true},
    {kode:'MK-303',nama:'Instrumen Mayor I',sks:3,smt:1,wajib:true},
    {kode:'MK-304',nama:'Psikologi Pendidikan',sks:2,smt:1,wajib:true},
    {kode:'MK-305',nama:'Pendidikan Agama',sks:2,smt:1,wajib:true},
    {kode:'MK-306',nama:'Metode Dalcroze/Kodaly/Orff',sks:2,smt:2,wajib:true},
    {kode:'MK-307',nama:'Arransemen Musik Pendidikan',sks:2,smt:2,wajib:false}
  ]
};
function katalogFor(idProdi){
  return KATALOG_MK[idProdi] || KATALOG_MK['P01'];
}

/* ---------- Settings ---------- */
const DEFAULT_SETTINGS = {
  biaya_registrasi: 350000,
  bank_nama: 'Bank Negeri Indonesia (BNI)',
  bank_rekening: '1234567890',
  bank_atas_nama: 'Yayasan STIKMI',
  bank_cabang: 'Jakarta Selatan'
};

/* ---------- DB: cache in-memory yang sinkron dengan server Supabase ---------- */
const DB = {
  _cache:{ registrations:[], accounts:[], documents:[], invoices:[], krs:[], announcements:[], readmarks:[], settings:Object.assign({},DEFAULT_SETTINGS) },
  async sync(){
    if(!sb) return null;
    const { data, error } = await sb.rpc('sync_all');
    if(error){ console.error('sync_all error:', error); toast('Gagal memuat data: '+esc(error.message),'bad'); return null; }
    const d = data || {};
    // Petakan ke bentuk lama agar fungsi render/admin lama tetap kompatibel
    DB._cache.registrations = (d.registrations||[]).map(r=>
      Object.assign({}, r.data||{}, { id:r.id, submitted_by:r.submitted_by,
        pembayaran:r.pembayaran||{}, status:r.status, nim:r.nim,
        created_at:r.created_at, data:r.data||{} }));
    DB._cache.accounts = (d.accounts||[]).map(p=>({
      id:p.id, username:p.email, email:p.email, role:p.role, nama:p.nama,
      nim:p.nim, prodi:p.prodi, regId:p.reg_id, created:p.created_at }));
    DB._cache.documents = (d.documents||[]).map(x=>({
      id:x.id, owner:x.owner, owner_email:x.owner_email, nama:x.nama, nim:x.nim,
      type:x.type, semester:x.semester, keterangan:x.keterangan,
      fileName:x.file_name, size:x.size, mime:x.mime, file_path:x.file_path,
      uploaded:x.uploaded_at }));
    DB._cache.invoices = d.invoices || [];
    DB._cache.krs = d.krs || [];
    DB._cache.announcements = d.announcements || [];
    DB._cache.readmarks = (d.readmarks||[]).map(r=>({ userId:r.user_id, annId:r.announcement_id, read_at:r.read_at }));
    if(d.settings) DB._cache.settings = Object.assign({}, DEFAULT_SETTINGS, d.settings);
    DB._role = d.role || 'anon';
    DB._profile = d.profile || null;
    return d;
  },
  getReg(){ return DB._cache.registrations; },
  getAcc(){ return DB._cache.accounts; },
  getDoc(){ return DB._cache.documents; },
  getInv(){ return DB._cache.invoices; },
  getKRS(){ return DB._cache.krs; },
  getAnn(){ return DB._cache.announcements; },
  getRead(){ return DB._cache.readmarks; },
  getSet(){ return DB._cache.settings; },
  // Stub save* (dipertahankan agar kode lama tidak error); mutasi nyata lewat RPC.
  saveReg(){}, saveAcc(){}, saveDoc(){}, saveInv(){}, saveKRS(){}, saveAnn(){}, saveRead(){}, saveSet(){}
};

/* ---------- Session: dibungkus Supabase Auth + cache profil ---------- */
const Session = {
  _u:null,
  get(){ return Session._u || JSON.parse(sessionStorage.getItem('stikmi_session')||'null'); },
  set(u){ Session._u=u; sessionStorage.setItem('stikmi_session', JSON.stringify(u)); },
  clear(){ Session._u=null; sessionStorage.removeItem('stikmi_session'); }
};

/* ---------- Helpers ---------- */
const $ = (sel,el=document)=>el.querySelector(sel);
const $$ = (sel,el=document)=>Array.from(el.querySelectorAll(sel));
const el = (tag,attrs={},html='')=>{ const e=document.createElement(tag); for(const k in attrs){ if(k==='class')e.className=attrs[k]; else if(k==='dataset')Object.assign(e.dataset,attrs[k]); else e.setAttribute(k,attrs[k]); } if(html)e.innerHTML=html; return e; };
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

function genNIM(){
  // Preview sisi klien. NIM final di-generate server (approve_registration) bila dikosongkan.
  const year = new Date().getFullYear();
  const n = Math.floor(Math.random()*900)+1;
  return `${year}${String(n).padStart(3,'0')}`;
}
function rupiah(n){
  if(n===null||n===undefined||n==='') return '-';
  const num = Number(n);
  if(isNaN(num)) return String(n);
  return 'Rp ' + num.toLocaleString('id-ID');
}
function fmtDate(s){
  if(!s) return '-';
  try{ const d=new Date(s); return d.toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'}); }catch(e){return s}
}
function fmtDateTime(ts){
  if(!ts) return '-';
  try{ const d=new Date(ts); return d.toLocaleString('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }catch(e){return ts}
}
function esc(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function readFileAsDataURL(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(r.result);
    r.onerror=reject;
    r.readAsDataURL(file);
  });
}
/* Unduh file dari Storage Supabase (bucket private → signed URL) */
async function downloadStorageFile(path, name){
  if(!sb || !path){ toast('File tidak tersedia','warn'); return; }
  try{
    const { data, error } = await sb.storage.from('stikmi-docs').createSignedUrl(path, 60);
    if(error || !data){ toast('Gagal membuat tautan: '+(error?.message||''),'bad'); return; }
    const a = el('a',{href:data.signedUrl, download:name||''});
    document.body.appendChild(a); a.click(); a.remove();
  }catch(e){ toast('Gagal: '+e.message,'bad'); }
}
/* Buka file Storage di tab baru (untuk pratinjau PDF/gambar) */
async function viewStorageFile(path){
  if(!sb || !path){ toast('File tidak tersedia','warn'); return; }
  try{
    const { data, error } = await sb.storage.from('stikmi-docs').createSignedUrl(path, 60);
    if(error || !data){ toast('Gagal: '+(error?.message||''),'bad'); return; }
    window.open(data.signedUrl, '_blank');
  }catch(e){ toast('Gagal: '+e.message,'bad'); }
}
function toast(msg,type='info'){
  const t=el('div',{class:'alert '+type});
  t.textContent=msg;
  t.style.position='fixed';
  t.style.top='70px';
  t.style.left='50%';
  t.style.transform='translateX(-50%)';
  t.style.zIndex='90';
  t.style.maxWidth='90vw';
  t.style.boxShadow='var(--shadow)';
  document.body.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='.3s'; setTimeout(()=>t.remove(),300); },2600);
}

function route(){
  const hash = location.hash.replace(/^#/,'') || '/';
  $('#year').textContent = new Date().getFullYear();
  renderNav();
  const v = $('#view');
  if(!_booted){ v.innerHTML = '<div class="wrap" style="padding:48px 16px;text-align:center;color:var(--muted)">Memuat data dari server…</div>'; return; }
  const sess = Session.get();

  if(hash==='/' || hash===''){
    v.innerHTML = viewLanding();
  } else if(hash==='/daftar'){
    v.innerHTML = viewDaftar();
    bindDaftar();
  } else if(hash==='/login'){
    v.innerHTML = viewLogin();
    bindLogin();
  } else if(hash==='/lupa-password'){
    v.innerHTML = viewLupaPassword();
    bindLupaPassword();
  } else if(hash==='/reset-password'){
    v.innerHTML = viewResetPassword();
    bindResetPassword();
  } else if(hash==='/admin'){
    if(!sess || sess.role!=='admin'){ v.innerHTML = viewLogin('admin'); bindLogin('admin'); return; }
    v.innerHTML = viewAdmin();
    bindAdmin();
  } else if(hash==='/mahasiswa'){
    if(!sess || sess.role!=='mahasiswa'){ v.innerHTML = viewLogin('mahasiswa'); bindLogin('mahasiswa'); return; }
    v.innerHTML = viewMahasiswa();
    bindMahasiswa();
  } else {
    v.innerHTML = viewLanding();
  }
  window.scrollTo(0,0);
}

function renderNav(){
  const nav = $('#topnav');
  const sess = Session.get();
  nav.innerHTML = '';
  const add = (label,href)=>nav.appendChild(el('a',{href:href},label));
  add('Beranda','#/');
  add('Pendaftaran','#/daftar');
  if(sess){
    if(sess.role==='admin'){ add('Panel Admin','#/admin'); }
    if(sess.role==='mahasiswa'){ add('Portal Mahasiswa','#/mahasiswa'); }
    const u = el('button',{class:'user'},'👤 '+sess.nama+' ('+sess.role+')');
    u.style.cursor='default';
    nav.appendChild(u);
    const out = el('button',{},'Keluar');
    out.onclick=async ()=>{
      if(sb){ try{ await sb.auth.signOut(); }catch(e){} }
      Session.clear(); DB._cache={registrations:[],accounts:[],documents:[],invoices:[],krs:[],announcements:[],readmarks:[],settings:Object.assign({},DEFAULT_SETTINGS)};
      location.hash='#/'; route();
    };
    nav.appendChild(out);
  } else {
    add('Masuk','#/login');
  }
}

/* ---------- Boot: init Supabase, restore session, sync data ---------- */
let _booted = false;
async function boot(){
  initSupabase();
  if(sb){
    try{
      const { data } = await sb.auth.getSession();
      if(data && data.session){
        await DB.sync();
        const p = DB._profile;
        if(p && p.role && p.role!=='pending'){
          Session.set({uid:p.id, username:p.email, role:p.role, nama:p.nama||p.email, nim:p.nim||null, regId:p.reg_id||null, email:p.email});
        } else { Session.clear(); }
      } else { await DB.sync(); }
    }catch(e){ console.error('boot error', e); }
  } else {
    // CONFIG belum diisi → tampilkan pesan setup
    $('#view').innerHTML = `<div class="wrap" style="padding:48px 16px"><div class="alert warn">
      <b>Aplikasi belum dikonfigurasi.</b> Buka file ini di teks editor, isi
      <code>SUPABASE_URL</code> &amp; <code>SUPABASE_KEY</code> sesuai
      <b>PANDUAN_SETUP_SUPABASE.md</b>, lalu muat ulang halaman.</div></div>`;
    renderNav();
    return;
  }
  _booted = true;
  route();
}
window.addEventListener('hashchange', route);
window.addEventListener('DOMContentLoaded', boot);

async function bindDaftar(){
  const form = $('#formDaftar');

  // chips konsentrasi (max 2)
  $$('#konsentrasiGroup .chip').forEach(c=>{
    c.onclick=()=>{
      if(!c.classList.contains('on') && $$('#konsentrasiGroup .chip.on').length>=2){
        toast('Maksimal 2 peminatan konsentrasi','warn'); return;
      }
      c.classList.toggle('on');
    };
  });

  // toggle payment fields
  const chk = $('#chkBayar');
  chk.onchange=()=>{
    $('#bayarFields').style.display = chk.checked ? 'block':'none';
    $('#buktiReq').textContent = chk.checked?'*':'';
    form.elements['berkas_bukti'].required = chk.checked;
  };

  $('#btnSubmitDaftar').onclick = async (e)=>{
    e.preventDefault();
    const msg = $('#daftarMsg'); msg.innerHTML='';
    if(!form.checkValidity()){ form.reportValidity(); return; }
    const fd = new FormData(form);
    if(fd.get('password') !== fd.get('password2')){
      msg.innerHTML='<div class="alert bad">Password dan konfirmasi tidak sama.</div>'; return;
    }
    const konsentrasi = $$('#konsentrasiGroup .chip.on').map(c=>c.dataset.v);
    if(konsentrasi.length<1){
      msg.innerHTML='<div class="alert bad">Pilih minimal 1 peminatan konsentrasi.</div>'; return;
    }
    if(konsentrasi.length>2){
      msg.innerHTML='<div class="alert bad">Maksimal 2 peminatan konsentrasi.</div>'; return;
    }
    const btn = $('#btnSubmitDaftar'); btn.disabled=true; btn.textContent='Memproses...';
    const email = String(fd.get('email')).trim();
    const password = fd.get('password');
    const uname = String(fd.get('username')||'').toLowerCase();

    // 1) Daftarkan akun via Supabase Auth (email + password)
    let suUser = null;
    try{
      const { data:su, error:suErr } = await sb.auth.signUp({ email, password,
        options:{ data:{ nama: fd.get('nama_lengkap') } } });
      if(suErr){ throw new Error(suErr.message); }
      suUser = su.user;
      if(!suUser){ throw new Error('Pendaftaran akun gagal (mungkin email sudah terpakai).'); }
    }catch(err){
      msg.innerHTML='<div class="alert bad">'+esc(err.message||err)+'</div>';
      btn.disabled=false; btn.textContent='Kirim Pendaftaran'; return;
    }
    const newUid = suUser.id;

    // 2) Unggah berkas ke Storage bucket "stikmi-docs"
    const uploadBerkas = async (key, field)=>{
      const f = fd.get(key);
      if(!f || !f.size) return null;
      if(f.size > 5*1024*1024){ throw new Error('Berkas '+key.replace('berkas_','')+' melebihi 5MB'); }
      const path = `registrations/${newUid}/${field}/${Date.now()}-${f.name}`;
      const { error:upErr } = await sb.storage.from('stikmi-docs')
        .upload(path, f, { contentType:f.type||'application/octet-stream', upsert:false });
      if(upErr){ throw new Error('Gagal unggah '+field+': '+upErr.message); }
      return { name:f.name, size:f.size, type:f.type, path };
    };
    // sudahBayar WAJIB dideklarasikan sebelum dipakai di blok unggah berkas di bawah.
    // (Bug lama: 'const sudahBayar' ditulis SETELAH 'if(sudahBayar)' → TDZ ReferenceError
    //  → submit_registration tidak pernah dipanggil → pendaftar tidak muncul di admin.)
    const sudahBayar = fd.get('sudah_bayar')==='on';
    let berkas, bukti;
    try{
      berkas = {
        foto: await uploadBerkas('berkas_foto','foto'),
        ijazah: await uploadBerkas('berkas_ijazah','ijazah'),
        ktp: await uploadBerkas('berkas_ktp','ktp')
      };
      if(sudahBayar) bukti = await uploadBerkas('berkas_bukti','bukti');
    }catch(err){
      msg.innerHTML='<div class="alert bad">'+esc(err.message)+'</div>';
      btn.disabled=false; btn.textContent='Kirim Pendaftaran'; return;
    }

    const st = DB.getSet();
    const data = {
      id_prodi: fd.get('id_prodi'),
      nama_prodi: prodiName(fd.get('id_prodi')),
      peminatan_program: fd.get('peminatan_program'),
      konsentrasi,
      instrumen_mayor: fd.get('instrumen_mayor'),
      instrumen_mayor_lain: fd.get('instrumen_mayor_lain')||'',
      nama_lengkap: fd.get('nama_lengkap'),
      nik: fd.get('nik'),
      jenis_kelamin: fd.get('jenis_kelamin'),
      tempat_lahir: fd.get('tempat_lahir'),
      tanggal_lahir: fd.get('tanggal_lahir'),
      agama: fd.get('agama'),
      kewarganegaraan: fd.get('kewarganegaraan'),
      status_sipil: fd.get('status_sipil'),
      jalan: fd.get('jalan'),
      rt_rw: fd.get('rt_rw'),
      kel_kec: fd.get('kel_kec'),
      kab_kota: fd.get('kab_kota'),
      provinsi: fd.get('provinsi'),
      kode_pos: fd.get('kode_pos'),
      telepon: fd.get('telepon'),
      hp: fd.get('hp'),
      email: email,
      nama_ortu: fd.get('nama_ortu'),
      kerja_ortu: fd.get('kerja_ortu'),
      penghasilan_ortu: fd.get('penghasilan_ortu'),
      alamat_ortu: fd.get('alamat_ortu'),
      telepon_ortu: fd.get('telepon_ortu'),
      hp_ortu: fd.get('hp_ortu'),
      email_ortu: fd.get('email_ortu'),
      nama_sma: fd.get('nama_sma'),
      jurusan_sma: fd.get('jurusan_sma'),
      tahun_lulus_sma: fd.get('tahun_lulus_sma'),
      nisn: fd.get('nisn'),
      alamat_sma: fd.get('alamat_sma'),
      pt_sebelumnya: fd.get('pt_sebelumnya'),
      jurusan_pt: fd.get('jurusan_pt'),
      tahun_pt: fd.get('tahun_pt'),
      lama_belajar: fd.get('lama_belajar'),
      tingkat_grade: fd.get('tingkat_grade'),
      sekolah_musik: fd.get('sekolah_musik'),
      guru_musik: fd.get('guru_musik'),
      repertoar: fd.get('repertoar'),
      kompetisi: fd.get('kompetisi'),
      prestasi: fd.get('prestasi'),
      instrumen_lain: fd.get('instrumen_lain'),
      lama_belajar_lain: fd.get('lama_belajar_lain'),
      bahan_audisi: fd.get('bahan_audisi'),
      motivasi: fd.get('motivasi'),
      jalur_masuk: fd.get('jalur_masuk'),
      jalur_masuk_label: jalurLabel(fd.get('jalur_masuk')),
      tgl_masuk_kuliah: fd.get('tgl_masuk_kuliah'),
      semester_mulai: fd.get('semester_mulai')||'1',
      kelas: fd.get('kelas')||'Pagi',
      username: uname,
      berkas,
      pembayaran: {
        sudah_bayar: sudahBayar,
        jumlah: st.biaya_registrasi,
        tgl_bayar: fd.get('tgl_bayar')||'',
        bukti: bukti,
        verified: false,
        verified_at: null
      }
    };
    // 3) Simpan data formulir via RPC
    const { error:rErr } = await sb.rpc('submit_registration', { p_data: data });
    if(rErr){
      msg.innerHTML='<div class="alert bad">Gagal menyimpan pendaftaran: '+esc(rErr.message)+'</div>';
      btn.disabled=false; btn.textContent='Kirim Pendaftaran'; return;
    }
    await DB.sync();
    // logout agar sesi 'pending' tidak tersangkut; mahasiswa login setelah disetujui admin
    try{ await sb.auth.signOut(); }catch(e){}
    Session.clear();
    btn.disabled=false; btn.textContent='Kirim Pendaftaran';
    const bayarNote = sudahBayar
      ? ' Pembayaran Anda akan diverifikasi admin.'
      : ' Anda belum mengonfirmasi pembayaran — admin dapat menandainya belum bayar.';
    msg.innerHTML='<div class="alert ok">Pendaftaran berhasil dikirim. Status: <b>PENDING</b>.'+bayarNote+' Akun: <b>'+esc(email)+'</b>. Admin akan meninjau &amp; menyetujui, lalu Anda bisa login.</div>';
    toast('Pendaftaran terkirim!','ok');
    form.reset();
    $$('#konsentrasiGroup .chip.on').forEach(c=>c.classList.remove('on'));
    $('#bayarFields').style.display='none';
    setTimeout(()=>{ location.hash='#/login'; }, 3200);
  };
}

function downloadDataURL(dataURL, fileName){
  const comma=dataURL.indexOf(',');
  const meta=dataURL.slice(0,comma);
  const dataPart=dataURL.slice(comma+1);
  const isBase64=/;base64/i.test(meta);
  const mime=(meta.match(/data:([^;]+)/)||['','application/octet-stream'])[1];
  if(isBase64){
    const bin=atob(dataPart);
    const arr=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    triggerDownload(new Blob([arr],{type:mime}), fileName);
  } else {
    triggerDownload(new Blob([decodeURIComponent(dataPart)],{type:mime}), fileName);
  }
}

  html += verified.length ? `<div class="table-wrap"><table>
    <thead><tr><th>Pendaftar</th><th>Jumlah</th><th>Tgl Transfer</th><th>Bukti</th><th>Status</th><th class="right">Aksi</th></tr></thead>

}

async function verifyRegPayment(id, ok){
  const r = DB.getReg().find(x=>x.id===id); if(!r) return;
  const pay = r.pembayaran || {sudah_bayar:false,jumlah:0,bukti:null};
  if(ok){
    pay.verified = true; pay.verified_at = Date.now(); pay.sudah_bayar = true;
  } else {
    if(!confirm('Tolak/batalkan klaim pembayaran '+(r.data?.nama_lengkap||r.nama_lengkap||'')+'?')) return;
    pay.verified = false; pay.verified_at = null;
  }
  const { error } = await sb.rpc('update_registration', { p_id:id, p_patch:{ pembayaran: pay } });
  if(error){ toast('Gagal: '+error.message,'bad'); return; }
  await DB.sync();
  toast(ok ? 'Pembayaran diverifikasi LUNAS' : 'Klaim pembayaran dibatalkan', ok?'ok':'warn'); route();
}

async function saveInvoice(mass){
  const f=$('#formInv'); if(!f) return;
  const fd=new FormData(f);
  const jumlah = Number(fd.get('jumlah'));
  if(!jumlah || jumlah<1000){ toast('Jumlah tidak valid','bad'); return; }
  const mhs = DB.getAcc().filter(a=>a.role==='mahasiswa');
  const targetEmail = fd.get('username');
  const targets = mass ? mhs : mhs.filter(m=>m.username===targetEmail);
  if(!targets.length){ toast('Tidak ada target','warn'); return; }
  const p_inv = { email: targetEmail, username: targetEmail,
    jenis: fd.get('jenis'), jumlah,
    semester: fd.get('semester')||'', tahun_ajaran: fd.get('tahun_ajaran')||'',
    jatuh_tempo: fd.get('jatuh_tempo')||'' };
  const { error } = await sb.rpc('create_invoice', { p_inv, p_mass: !!mass });
  if(error){ toast('Gagal: '+error.message,'bad'); return; }
  await DB.sync();
  closeModal();
  toast((mass?targets.length+' tagihan massal':'Tagihan')+' dibuat','ok');
  route();
}

function exportNEO(kind){
  const regs = DB.getReg().filter(r=>r.status==='accepted');
  if((kind==='json'||kind==='csv') && !regs.length){ toast('Tidak ada mahasiswa diterima untuk diekspor','warn'); return; }
  const feederRows = regs.map(r=>({
    nim: r.nim,
    nama_mahasiswa: r.nama_lengkap,
    nik: r.nik,
    tempat_lahir: r.tempat_lahir,
    tanggal_lahir: r.tanggal_lahir,
    jenis_kelamin: r.jenis_kelamin,
    agama_id: agamaId(r.agama),
    nama_agama: r.agama,
    kewarganegaraan: r.kewarganegaraan,
    status_sipil: statusSipilCode(r.status_sipil),
    jalan: r.jalan, rt_rw: r.rt_rw, kel_kec: r.kel_kec,
    kab_kota: r.kab_kota, kode_pos: r.kode_pos,
    nama_wilayah: r.provinsi,
    handphone: r.hp, telepon: r.telepon, email: r.email,
    id_pendaftar: r.id,
    tanggal_masuk_kuliah: r.tgl_masuk_kuliah,
    nama_ibu_kandung: r.nama_ortu,
    id_prodi: r.id_prodi,
    nama_program_studi: r.nama_prodi,
    peminatan_program: r.peminatan_program,
    konsentrasi: (r.konsentrasi||[]).join('; '),
    instrumen_mayor: r.instrumen_mayor,
    jalur_masuk: r.jalur_masuk,
    semester_masuk: r.semester_mulai,
    kelas: r.kelas,
    nisn: r.nisn,
    nama_sekolah_asal: r.nama_sma,
    tahun_lulus_sma: r.tahun_lulus_sma,
    pembayaran_registrasi: r.pembayaran&&r.pembayaran.verified?'lunas':'belum',
    perguruan_tinggi: 'STIKMI - Sekolah Tinggi Internasional Konservatori Musik Indonesia'
  }));
  let blob, name;
  if(kind==='json'){
    const payload = {
      perguruan_tinggi:'STIKMI', generated_at:new Date().toISOString(),
      feeder_tables:{ mahasiswa_pt: feederRows }, count: feederRows.length
    };
    blob = new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    name = 'stikmi_neofeeder_'+stamp()+'.json';
  } else if(kind==='csv'){
    const cols = Object.keys(feederRows[0]);
    const lines=[cols.join(',')];
    feederRows.forEach(r=>lines.push(cols.map(c=>csvCell(r[c])).join(',')));
    blob = new Blob([lines.join('\n')],{type:'text/csv'});
    name = 'stikmi_mahasiswa_pt_'+stamp()+'.csv';
  } else if(kind==='csv_reg'){
    const all = DB.getReg();
    const cols = ['timestamp','status','nama_lengkap','nik','jenis_kelamin','hp','email','id_prodi','nama_prodi','peminatan_program','konsentrasi','instrumen_mayor','jalur_masuk_label','tgl_masuk_kuliah','kelas','nama_sma','tahun_lulus_sma','username','nim','pembayaran_status'];
    const lines=[cols.join(',')];
    all.forEach(r=>{
      const pay = r.pembayaran? (r.pembayaran.verified?'lunas':r.pembayaran.sudah_bayar?'claimed':'belum') : 'belum';
      const row = {...r, konsentrasi:(r.konsentrasi||[]).join('; '), pembayaran_status:pay};
      lines.push(cols.map(c=>csvCell(row[c])).join(','));
    });
    blob = new Blob([lines.join('\n')],{type:'text/csv'});
    name = 'stikmi_pendaftar_'+stamp()+'.csv';
  } else {
    const invs = DB.getInv();
    if(!invs.length){ toast('Tidak ada tagihan','warn'); return; }
    const cols = ['no_inv','nim','nama','jenis','jumlah','semester','tahun_ajaran','jatuh_tempo','status','tgl_bayar'];
    const lines=[cols.join(',')];
    invs.forEach(v=>lines.push(cols.map(c=>csvCell(v[c])).join(',')));
    blob = new Blob([lines.join('\n')],{type:'text/csv'});
    name = 'stikmi_tagihan_'+stamp()+'.csv';
  }
  triggerDownload(blob,name);
  toast('Ekspor selesai: '+name,'ok');
}
function agamaId(a){ return ({Islam:'1',Kristen:'2',Katolik:'3',Hindu:'4',Buddha:'5',Konghucu:'6'})[a]||'99'; }
function statusSipilCode(s){ return s==='Kawin'?'1':'0'; }
function csvCell(v){
  if(v===null||v===undefined) return '';
  const s=String(v);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function stamp(){ const d=new Date(); const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes()); }

function renderKrsCourses(){
  const sess = Session.get();
  const reg = DB.getReg().find(r=>r.id===sess.regId)||{};
  const katalog = katalogFor(reg.id_prodi);
  const smt = Number($('#krsSemester').value);
  const list = katalog.filter(c=>c.smt===smt);
  const box = $('#krsCourseList');
  box.innerHTML = list.map(c=>`
    <label class="krs-course">
      <input type="checkbox" data-kode="${esc(c.kode)}" data-sks="${c.sks}" ${c.wajib?'checked disabled':''}>
      <span class="cinfo"><b>${esc(c.kode)} — ${esc(c.nama)}</b> · ${c.sks} SKS ${c.wajib?'<span class="badge pending">WAJIB</span>':'<span class="badge accepted">PILIHAN</span>'}</span>
    </label>`).join('') || '<div class="empty">Tidak ada mata kuliah untuk semester ini.</div>';
  box.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.onchange = updateKrsTotal;
  });
  updateKrsTotal();
}
function updateKrsTotal(){
  const boxes = $$('#krsCourseList input[type=checkbox]:checked');
  const total = boxes.reduce((s,b)=>s+Number(b.dataset.sks),0);
  const t = $('#krsTotal'); if(!t) return;
  t.textContent = total;
  const btn = $('#btnSubmitKRS');
  if(btn) btn.disabled = total===0;
  t.style.color = total>MAX_SKS ? 'var(--bad)' : 'var(--maroon-dark)';
}
async function submitKRS(){
  const sess = Session.get();
  const reg = DB.getReg().find(r=>r.id===sess.regId)||{};
  const smt = Number($('#krsSemester').value);
  const ta = $('#formKRS').elements['tahun_ajaran'].value.trim();
  const checked = $$('#krsCourseList input[type=checkbox]:checked');
  const katalog = katalogFor(reg.id_prodi);
  const courses = checked.map(b=>{
    const c = katalog.find(x=>x.kode===b.dataset.kode);
    return {kode:c.kode, nama:c.nama, sks:c.sks, wajib:!!c.wajib};
  });
  const total = courses.reduce((s,c)=>s+c.sks,0);
  if(!courses.length){ toast('Pilih minimal satu mata kuliah','bad'); return; }
  if(total>MAX_SKS){ toast('Melebihi maksimal '+MAX_SKS+' SKS','bad'); return; }
  const krsList = DB.getKRS();
  if(krsList.some(k=>k.username===sess.username && k.semester===smt && k.status!=='rejected')){
    toast('Sudah ada KRS aktif untuk semester '+smt,'warn'); return;
  }
  const { error } = await sb.rpc('submit_krs', { p_data: { semester:String(smt), tahun_ajaran:ta, courses, total_sks:total } });
  if(error){ toast('Gagal: '+error.message,'bad'); return; }
  await DB.sync();
  toast('KRS diajukan, menunggu persetujuan admin','ok');
  route();
}

<div><b>Status</b> : DISETUJUI</div></div>

function openClaimInvoice(id){
  const v = DB.getInv().find(x=>x.id===id); if(!v) return;
  if(v.status==='lunas'){ toast('Tagihan sudah lunas','ok'); return; }
  openModal('Konfirmasi Pembayaran — '+esc(v.jenis), `
    <div class="pay-box mb">
      <div class="amount">${rupiah(v.jumlah)}</div>
      <div class="muted" style="font-size:.85rem">${esc(v.no_inv)}${v.semester?' · Semester '+esc(v.semester):''}</div>
    </div>
    <form id="formClaim" onsubmit="return false">
      <label>Tanggal Transfer <span class="req">*</span></label>
      <input type="date" name="tgl_bayar" required>
      <div class="help mb">Nama Anda: <b>${esc(v.nama)}</b> — pastikan transfer sesuai nama ini.</div>
      <label>Bukti Transfer (JPG/PNG/PDF) <span class="req">*</span></label>
      <input type="file" name="bukti" accept="application/pdf,image/png,image/jpeg" required>
      <div class="help">Maks 3 MB. Admin akan memverifikasi bukti ini.</div>
    </form>`,
    `<button class="btn ghost" onclick="closeModal()">Batal</button>
     <button class="btn" onclick="saveClaimInvoice('${v.id}')">Kirim Konfirmasi</button>`);
}
async function saveClaimInvoice(id){
  const f=$('#formClaim'); if(!f) return;
  if(!f.checkValidity()){ f.reportValidity(); return; }
  const fd=new FormData(f);
  const file = fd.get('bukti');
  if(!file || !file.size){ toast('Pilih file bukti','bad'); return; }
  if(file.size > 5*1024*1024){ toast('Ukuran melebihi 5 MB','bad'); return; }
  const path = `invoices/${id}/${Date.now()}-${file.name}`;
  const { error:upErr } = await sb.storage.from('stikmi-docs')
    .upload(path, file, { contentType:file.type||'application/octet-stream', upsert:false });
  if(upErr){ toast('Gagal unggah bukti: '+upErr.message,'bad'); return; }
  const bukti = { name:file.name, size:file.size, type:file.type, path };
  const { error } = await sb.rpc('update_invoice', { p_id:id, p_patch:{
    status:'claimed', tgl_bayar: fd.get('tgl_bayar'), bukti } });
  if(error){ toast('Gagal: '+error.message,'bad'); return; }
  await DB.sync();
  closeModal();
  toast('Konfirmasi pembayaran terkirim. Menunggu verifikasi admin.','ok');
  route();
}

    t.onclick=()=>{
      $$('.tab').forEach(x=>x.classList.remove('active'));
      $$('.tabpane').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      $('#tp-'+t.dataset.tab).classList.add('active');
    };
  });
  // upload dokumen
  const fileInput = $('#fileInput');
  if(fileInput){
    fileInput.onchange=()=>{
      const f=fileInput.files[0];
      if(f) $('#fileInfo').textContent = `${f.name} — ${(f.size/1024).toFixed(0)} KB`;
    };
  }
  const btnUpload = $('#btnUpload');
  if(btnUpload){
    btnUpload.onclick = async ()=>{
      const form=$('#formUpload'); const fd=new FormData(form);
      const f = fd.get('file');
      if(!f || !f.size){ $('#uploadMsg').innerHTML='<div class="alert bad">Pilih file terlebih dahulu.</div>'; return; }
      if(f.size > 5*1024*1024){ $('#uploadMsg').innerHTML='<div class="alert bad">Ukuran file melebihi 5 MB.</div>'; return; }
      btnUpload.disabled=true; btnUpload.textContent='Mengunggah...';
      try{
        const { data:uData } = await sb.auth.getUser();
        const uid_ = uData?.user?.id || 'anon';
        const path = `docs/${uid_}/${Date.now()}-${f.name}`;
        const { error:upErr } = await sb.storage.from('stikmi-docs')
          .upload(path, f, { contentType:f.type||'application/octet-stream', upsert:false });
        if(upErr){ throw new Error('Gagal unggah: '+upErr.message); }
        const meta = { type: fd.get('type'), semester: fd.get('semester'),
          keterangan: fd.get('keterangan'), file_path:path, file_name:f.name,
          size: String(f.size), mime: f.type };
        const { error:rErr } = await sb.rpc('add_document', { p_meta: meta });
        if(rErr){ throw new Error(rErr.message); }
        await DB.sync();
        $('#uploadMsg').innerHTML='<div class="alert ok">Dokumen terunggah.</div>';
        form.reset(); $('#fileInfo').textContent='';
        btnUpload.disabled=false; btnUpload.textContent='Unggah';
        toast('Dokumen terunggah','ok');
        route();
      }catch(err){
        $('#uploadMsg').innerHTML='<div class="alert bad">Gagal: '+esc(err.message)+'</div>';
        btnUpload.disabled=false; btnUpload.textContent='Unggah';
      }
    };
  }
  // KRS
  const krsSemester = $('#krsSemester');
  if(krsSemester){
    renderKrsCourses();
    krsSemester.onchange = renderKrsCourses;
    $('#btnSubmitKRS').onclick = submitKRS;
  }
}
async function delMyDoc(id){
  if(!confirm('Hapus dokumen ini? File di storage juga dihapus.')) return;
  const d = DB.getDoc().find(x=>x.id===id);
  const { error } = await sb.rpc('delete_document', { p_id:id });
  if(error){ toast('Gagal: '+error.message,'bad'); return; }
  if(d && d.file_path){ try{ await sb.storage.from('stikmi-docs').remove([d.file_path]); }catch(e){} }
  await DB.sync(); toast('Dokumen dihapus','warn'); route();
}
async function changeMyPass(){
  const np = prompt('Password baru (min 6):'); if(!np || np.length<6){ toast('Password baru tidak valid (min 6 karakter)','warn'); return; }
  const { error } = await sb.auth.updateUser({ password: np });
  if(error){ toast('Gagal: '+error.message,'bad'); return; }
  toast('Password diperbarui','ok');
}
</script>
